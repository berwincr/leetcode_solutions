<svg width="800" height="400"
xmlns="http://www.w3.org/2000/svg">

<style>
.title {
    font: bold 30px Arial;
}

.total {
    font: bold 52px Arial;
}

.label {
    font: bold 20px Arial;
}

.number {
    font: bold 20px Arial;
}

.small {
    font: 16px Arial;
}
</style>

<rect width="100%" height="100%" rx="20" fill="#0d1117"/>

<text x="400" y="55" text-anchor="middle"
class="title" fill="white">
LeetCode Progress
</text>

<text x="400" y="135" text-anchor="middle"
class="total" fill="#58a6ff">
1
</text>

<text x="400" y="165" text-anchor="middle"
class="small" fill="#8b949e">
Problems Solved
</text>

<!-- Easy -->
<text x="80" y="225"
class="label" fill="#3fb950">
Easy
</text>

<rect x="200" y="205"
width="350" height="25" rx="12"
fill="#21262d"/>

<rect x="200" y="205"
width="0" height="25" rx="12"
fill="#3fb950"/>

<text x="580" y="225"
class="number" fill="white">
0
</text>

<!-- Medium -->
<text x="80" y="285"
class="label" fill="#d29922">
Medium
</text>

<rect x="200" y="265"
width="350" height="25" rx="12"
fill="#21262d"/>

<rect x="200" y="265"
width="350" height="25" rx="12"
fill="#d29922"/>

<text x="580" y="285"
class="number" fill="white">
1
</text>

<!-- Hard -->
<text x="80" y="345"
class="label" fill="#f85149">
Hard
</text>

<rect x="200" y="325"
width="350" height="25" rx="12"
fill="#21262d"/>

<rect x="200" y="325"
width="0" height="25" rx="12"
fill="#f85149"/>

<text x="580" y="345"
class="number" fill="white">
0
</text>

</svg>
